plugins {
    id 'java'
    id "org.sonarqube" version "6.3.1.5724"
    id "com.gradleup.shadow" version "9.6.1"
}

group = 'fr.stan1712.wetston'
version = '2.2.0'

repositories {
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven {
        url 'https://jitpack.io'
    }
    mavenLocal()
}

sonar {
    properties {
        property "sonar.projectKey", "wetston_FireEquipment"
        property "sonar.projectName", "FireEquipment"
    }
}

project.tasks["sonar"].dependsOn("test", "build")

dependencies {
    compileOnly "org.spigotmc:spigot-api:26.2-R0.1-SNAPSHOT"
    compileOnly group: 'org.slf4j', name: 'slf4j-api', version: '2.0.16'

    implementation 'org.bstats:bstats-bukkit:3.2.1'

    compileOnly 'net.kyori:adventure-api:4.26.1'
    compileOnly 'net.kyori:adventure-text-minimessage:4.26.1'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.116.3'
}

repositories {
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

test {
    useJUnitPlatform()
}

def targetJavaVersion = 21
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

jar {
    archiveClassifier = 'plain'
}

shadowJar {
    archiveClassifier = ''
    relocate 'org.bstats', 'fr.stan1712.wetston.fireequipment.libs.bstats'
}

tasks.register('resourcePackZip', Zip) {
    from 'resourcepack'
    archiveBaseName = rootProject.name + '-pack'
    destinationDirectory = layout.buildDirectory.dir('resourcepack')
    reproducibleFileOrder = true
    preserveFileTimestamps = false
    doLast {
        def sha1 = java.security.MessageDigest.getInstance('SHA-1').digest(archiveFile.get().asFile.bytes).encodeHex().toString()
        println "Resource pack: ${archiveFile.get().asFile.name} (sha1 ${sha1})"
    }
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar'), tasks.named('resourcePackZip')
}

tasks.register('copyJar', Copy) {
    from "build/libs/" + rootProject.name + "-" + version + ".jar"
    into 'J:/@MINECRAFT/SERV LOCAL DEV/plugins'
}
