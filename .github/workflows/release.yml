name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'corretto'
          cache: 'gradle'
      - name: Read the project version
        id: project
        run: echo "version=$(grep -oP "^version = '\K[^']+" build.gradle)" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${{ steps.project.outputs.version }}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match build.gradle version ${{ steps.project.outputs.version }}"
            exit 1
          fi
      - name: Build the plugin and the resource pack
        run: ./gradlew build -x sonar --no-daemon
      - name: Upload the build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FireEquipment-${{ steps.project.outputs.version }}
          path: |
            build/libs/FireEquipment-${{ steps.project.outputs.version }}.jar
            build/resourcepack/FireEquipment-pack-${{ steps.project.outputs.version }}.zip
      - name: Attach the files to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.project.outputs.version }}
        run: |
          JAR="build/libs/FireEquipment-${VERSION}.jar"
          ZIP="build/resourcepack/FireEquipment-pack-${VERSION}.zip"
          SHA1=$(sha1sum "${ZIP}" | cut -d' ' -f1)
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${JAR}" "${ZIP}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${JAR}" "${ZIP}" --title "${GITHUB_REF_NAME}" --generate-notes --notes "Resource pack SHA-1: \`${SHA1}\`"
          fi
