name: FireEquipment
version: '${version}'
main: fr.stan1712.wetston.fireequipment.Main
api-version: '1.21'

author: stan1712
website: https://stan1712.com
description: Roleplay Tools to enhance Firefigther gameplay in your server
prefix: FireEquipment

commands:
  fequip:
    description: Firefighter tools and realistic fire management.
    usage: /fequip <help/version/reload/fire/hose/pump/extinguisher>
    aliases: [equip, firequip, fireequipment]

permissions:
  firequip.admin.fire:
    description: View realistic fire stats and extinguish fires.
    default: op
    children:
      firequip.inspect: true
  firequip.inspect:
    description: Toggle the firefighter inspect view of the realistic fire.
    default: op
