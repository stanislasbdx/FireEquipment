Version: 0
Prefix: FireEquipment
ShortPrefix: "&6[&eFireEquip&6]"

Core:
  NoPerms: "You don't have the permission !"
  Reload: "Config file reloaded !"
  HelpMsg:
    Help: "Need help ? Type /firequip help"
    VersionHelp: "Plugin's version ? Type /firequip version"
    ReloadHelp: "You need to reload the config without reloading your server ? /firequip reload"
    DHelp: "Shows a help page"
    DVersion: "Be able to know plugin's version"
    DReload: "Reload the config file"
    DGive: "Be able to give yourself an item"
    DFire: "Realistic fire overview or extinguish fires"
  GiveMsg:
    Home: "What item do you need ?"
    Hose: "You got a fire hose"
    Pump: "You got a pump"
    Extinguisher: "You got an extinguisher"
  FireMsg:
    Status: "Realistic fire"
    Worlds: "Worlds"
    Burning: "Burning blocks"
    Smouldering: "Smouldering blocks"
    Cleared: "burning blocks extinguished"

Equipment:
  Hose:
    displayName: "Fire Hose"
    usage: "Right-click to throw water"
    range: 5
    cooldown: 10
    waterLifetime: 60
    itemModel: "fireequipment:hose"
  Pump:
    displayName: "Water Pump"
    usage: "Right-click to vacuum water"
    range: 4
    cooldown: 10
    itemModel: "fireequipment:pump"
  Extinguisher:
    displayName: "Extinguisher"
    usage: "Right-click to extinguish flames"
    range: 2
    cooldown: 10
    itemModel: "fireequipment:extinguisher"

ResourcePack:
  enabled: false
  url: ""
  sha1: ""
  prompt: "FireEquipment textures"
  force: false

realisticFire:
  enabled: true
  worlds: []
  performance:
    updateInterval: 10
    maxBurningBlocks: 3000
    maxUpdatesPerCycle: 400
  features:
    flashover: true
    heatAura: true
    weakBlocks: true
    collapse: true
    collapseEffects: true
    ash: true
    particles: true
    scorch: true
    tnt: true
  factors:
    burnTime: 1.0
    spread: 1.0
    heat: 1.0
    cooling: 1.0
    water: 1.0
    powder: 1.0
    flashover: 1.0
    heatAura: 1.0
    weakBlocks: 1.0
    ash: 1.0
  ash:
    materials:
      GRAY_CONCRETE_POWDER: 70
      GRAVEL: 30
  weakBlocks:
    materials:
      - "GLASS"
      - "TINTED_GLASS"
      - "*_STAINED_GLASS"
      - "GLASS_PANE"
      - "*_GLASS_PANE"
      - "#doors"
      - "#trapdoors"
  collapse:
    anchors:
      - "BEDROCK"
      - "BARRIER"
      - "REINFORCED_DEEPSLATE"
      - "END_PORTAL_FRAME"
      - "COMMAND_BLOCK"
      - "CHAIN_COMMAND_BLOCK"
      - "REPEATING_COMMAND_BLOCK"
      - "STRUCTURE_BLOCK"
      - "JIGSAW"
      - "LIGHT"
  categories:
    wood:
      burnTime: 45
      ignitionChance: 0.6
      maxHeat: 100
      materials:
        - "#logs_that_burn"
        - "#planks"
        - "#wooden_stairs"
        - "#wooden_slabs"
        - "#wooden_fences"
        - "#fence_gates"
        - "#wooden_doors"
        - "#wooden_trapdoors"
    foliage:
      burnTime: 6
      ignitionChance: 1.0
      maxHeat: 60
      ash: false
      materials:
        - "#leaves"
        - "#flowers"
        - "SHORT_GRASS"
        - "TALL_GRASS"
        - "FERN"
        - "LARGE_FERN"
        - "HAY_BLOCK"
        - "DRIED_KELP_BLOCK"
    textile:
      burnTime: 10
      ignitionChance: 0.9
      maxHeat: 70
      materials:
        - "#wool"
        - "#wool_carpets"
        - "#beds"
    paper:
      burnTime: 20
      ignitionChance: 0.8
      maxHeat: 80
      materials:
        - "BOOKSHELF"
    fuel:
      burnTime: 300
      ignitionChance: 0.3
      maxHeat: 150
      materials:
        - "COAL_BLOCK"
