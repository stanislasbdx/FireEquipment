Version: 0
Prefix: FireEquipment
ShortPrefix: "&6[&eFireEquip&6]"

Core:
  NoPerms: "You don't have the permission !"
  Reload: "Config file reloaded !"
  HelpMsg:
    Help: "Need help ? Type /firequip help"
    VersionHelp: "Plugin's version ? Type /firequip version"
    ReloadHelp: "You need to reload the config without reloading your server ? /firequip reload"
    DHelp: "Shows a help page"
    DVersion: "Be able to know plugin's version"
    DReload: "Reload the config file"
    DGive: "Be able to give yourself an item"
    DFire: "Realistic fire overview or extinguish fires"
  GiveMsg:
    Home: "What item do you need ?"
    Hose: "You got a fire hose"
    Pump: "You got a pump"
    Extinguisher: "You got an extinguisher"
  FireMsg:
    Status: "Realistic fire"
    Worlds: "Worlds"
    Burning: "Burning blocks"
    Smouldering: "Smouldering blocks"
    Cleared: "burning blocks extinguished"

Equipment:
  Hose:
    displayName: "Fire Hose"
    usage: "Right-click to throw water"
    range: 5
    cooldown: 10
    waterLifetime: 60
    itemModel: "fireequipment:hose"
  Pump:
    displayName: "Water Pump"
    usage: "Right-click to vacuum water"
    range: 4
    cooldown: 10
    itemModel: "fireequipment:pump"
  Extinguisher:
    displayName: "Extinguisher"
    usage: "Right-click to extinguish flames"
    range: 2
    cooldown: 10
    itemModel: "fireequipment:extinguisher"

ResourcePack:
  enabled: false
  url: ""
  sha1: ""
  prompt: "FireEquipment textures"
  force: false

realisticFire:
  enabled: true
  worlds: []
  updateInterval: 10
  maxBurningBlocks: 3000
  maxUpdatesPerCycle: 400
  heat:
    ignition: 45
    growth: 6
    dissipation: 1
    extinguishThreshold: 15
    reigniteThreshold: 40
    reigniteDelay: 10
  spread:
    radius: 1
    baseChance: 0.08
    heatPerNeighbor: 0.15
    upwardBonus: 2.0
  openAir:
    burnSpeed: 1.25
    heatDissipation: 3
    rainCooling: 2
  confinement:
    maxRoomVolume: 150
    burnSpeed: 0.7
    heatMultiplier: 1.8
    flashoverRadius: 4
    flashoverHeat: 600
    flashoverCooldown: 30
  water:
    hoseCooling: 12
    powderKnockdown: 90
    powderCooling: 5
    adjacentWaterCooling: 10
  heatAura:
    enabled: true
    radius: 6
    warnThreshold: 60
    igniteThreshold: 150
    fireTicksPerHeat: 2
    maxFireTicks: 160
  weakBlocks:
    enabled: true
    radius: 4
    burstHeat: 120
    burstChance: 0.25
    materials:
      - "GLASS"
      - "TINTED_GLASS"
      - "*_STAINED_GLASS"
      - "GLASS_PANE"
      - "*_GLASS_PANE"
      - "#doors"
      - "#trapdoors"
  ash:
    chance: 0.35
    materials:
      GRAY_CONCRETE_POWDER: 70
      GRAVEL: 30
    particles: true
    particleDuration: 60
    maxParticlesPerCycle: 300
  collapse:
    enabled: true
    maxHeight: 12
    minSideSupport: 2
    excluded:
      - "BEDROCK"
      - "OBSIDIAN"
      - "CRYING_OBSIDIAN"
      - "BARRIER"
      - "REINFORCED_DEEPSLATE"
      - "END_PORTAL_FRAME"
  categories:
    wood:
      burnTime: 45
      ignitionChance: 0.6
      maxHeat: 100
      materials:
        - "#logs_that_burn"
        - "#planks"
        - "#wooden_stairs"
        - "#wooden_slabs"
        - "#wooden_fences"
        - "#fence_gates"
        - "#wooden_doors"
        - "#wooden_trapdoors"
    foliage:
      burnTime: 6
      ignitionChance: 1.0
      maxHeat: 60
      ash: false
      materials:
        - "#leaves"
        - "#flowers"
        - "SHORT_GRASS"
        - "TALL_GRASS"
        - "FERN"
        - "LARGE_FERN"
        - "HAY_BLOCK"
        - "DRIED_KELP_BLOCK"
    textile:
      burnTime: 10
      ignitionChance: 0.9
      maxHeat: 70
      materials:
        - "#wool"
        - "#wool_carpets"
        - "#beds"
    paper:
      burnTime: 20
      ignitionChance: 0.8
      maxHeat: 80
      materials:
        - "BOOKSHELF"
    fuel:
      burnTime: 300
      ignitionChance: 0.3
      maxHeat: 150
      materials:
        - "COAL_BLOCK"
